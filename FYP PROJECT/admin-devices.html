<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReTech - Manage Devices</title>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHDs7rzfJbk9Vcj-i0A6EB2WRbmC6zqhY",
            authDomain: "fyp-retech.firebaseapp.com",
            projectId: "fyp-retech",
            storageBucket: "fyp-retech.firebasestorage.app",
            messagingSenderId: "555799764209",
            appId: "1:555799764209:web:5395d324437d64618f5d50",
            measurementId: "G-ESKJZ8ZH8P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.auth = auth;
        window.db = db;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut;
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;

        console.log("Firebase initialized for Manage Devices!");
    </script>

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="dashboard-container">
        <!-- TOP NAV -->
        <nav class="top-nav">
            <div class="nav-left">
                <div class="logo-small">RE<span class="blue-text">TECH</span></div>
            </div>
            <div class="nav-right">
                <a href="admin-dashboard.html" class="nav-link">Dashboard</a>
                <a href="admin-devices.html" class="nav-link active">Devices</a>
                <a href="admin-depreciation.html" class="nav-link">Depreciation</a>
                <a href="admin-users.html" class="nav-link">Users</a>
                <button id="logoutBtn" class="nav-logout">Logout</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <div class="admin-devices-container">
                <div class="admin-header">
                    <h2>📱 Manage Devices</h2>
                    <p>Add, edit, or remove brands and models</p>
                </div>

                <!-- Add Brand Form -->
                <div class="admin-form-card">
                    <h3>➕ Add New Brand</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newBrand">Brand Name</label>
                            <input type="text" id="newBrand" placeholder="e.g. Apple" />
                        </div>
                        <div class="form-group">
                            <label for="newCategory">Category</label>
                            <select id="newCategory">
                                <option value="Smartphone">Smartphone</option>
                                <option value="Laptop">Laptop</option>
                                <option value="Tablet">Tablet</option>
                                <option value="Smartwatch">Smartwatch</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn-add" onclick="addBrand()">➕ Add Brand</button>
                </div>

                <!-- Brand List -->
                <div class="admin-table-card">
                    <h3>📋 All Brands</h3>
                    <div id="brandsList">
                        <div class="history-empty">
                            <p>⏳ Loading brands...</p>
                        </div>
                    </div>
                </div>

                <!-- Models Section -->
                <div class="admin-table-card" id="modelsSection" style="display:none;">
                    <h3 id="modelsTitle">📋 Models for <span id="selectedBrandName"></span></h3>
                    <div class="form-row" style="margin-bottom: 15px;">
                        <div class="form-group">
                            <label for="newModel">Add New Model</label>
                            <input type="text" id="newModel" placeholder="e.g. iPhone 17" />
                        </div>
                    </div>
                    <button class="btn-add" onclick="addModel()">➕ Add Model</button>
                    <div id="modelsList" style="margin-top: 15px;">
                        <div class="history-empty">
                            <p>⏳ Loading models...</p>
                        </div>
                    </div>
                    <button class="btn-back" onclick="closeModels()">← Back to Brands</button>
                </div>

                <footer class="dashboard-footer">
                    <p>© 2026 ReTech. All rights reserved.</p>
                </footer>
            </div>
        </div>
    </div>

    <script src="admin-devices.js"></script>
</body>
</html>
