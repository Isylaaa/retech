<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReTech - Forgot Password</title>

    <!-- ===== FIREBASE SDK ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHDs7rzfJbk9Vcj-i0A6EB2WRbmC6zqhY",
            authDomain: "fyp-retech.firebaseapp.com",
            projectId: "fyp-retech",
            storageBucket: "fyp-retech.firebasestorage.app",
            messagingSenderId: "555799764209",
            appId: "1:555799764209:web:5395d324437d64618f5d50",
            measurementId: "G-ESKJZ8ZH8P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.auth = auth;
        window.sendPasswordResetEmail = sendPasswordResetEmail;

        console.log("Firebase initialized for Forgot Password!");
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-circle">◉</div>
                <span>RE<span class="blue-text">TECH</span></span>
            </div>

            <!-- Title -->
            <h1>Reset Password</h1>

            <p class="subtitle">
                Enter your email and we'll send you a reset link
            </p>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm">

                <!-- Email -->
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

                <!-- Send Reset Link Button -->
                <button type="submit" class="login-button">
                    SEND RESET LINK
                </button>

                <!-- Message -->
                <p id="resetMessage"></p>

            </form>

            <!-- Back to Login Link -->
            <p class="signup-text">
                Remember your password?
                <a href="index.html">Back to Login</a>
            </p>

            <!-- Footer -->
            <p class="footer-text">
                © 2026 ReTech. All rights reserved.
            </p>

        </div>

    </div>

    <script src="forgot-password.js"></script>

</body>
</html>
